services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sec
      POSTGRES_PASSWORD: sec
      POSTGRES_DB: sec_filings
    ports:
      - "5432:5432"
    volumes:
      - sec_filings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sec -d sec_filings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sec_filings_pgdata:
